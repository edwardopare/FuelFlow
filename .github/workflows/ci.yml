name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: Laravel API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict
      - run: composer audit --locked --no-interaction
      - run: vendor/bin/pint --test
      - run: php artisan test --compact

  web:
    name: React web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm run lint
      - run: pnpm run test:run
      - run: pnpm run build

  production-images:
    name: Production images
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.production.example -f compose.production.yaml config --quiet
      - run: docker build --file apps/api/Dockerfile.production --tag fuelflow-api:ci apps/api
      - run: docker build --file apps/web/Dockerfile.production --tag fuelflow-web:ci apps/web
