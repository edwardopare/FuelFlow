name: fuelflow-fsms

x-api-environment: &api-environment
  APP_NAME: FuelFlow FSMS
  APP_ENV: local
  APP_KEY: base64:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
  APP_DEBUG: "true"
  APP_URL: http://localhost:8000
  FRONTEND_URL: http://localhost:5173
  APP_TIMEZONE: Africa/Accra
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: ${POSTGRES_DB:-fuelflow}
  DB_USERNAME: ${POSTGRES_USER:-fuelflow}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-fuelflow-local}
  SESSION_DRIVER: redis
  SESSION_LIFETIME: "1440"
  VENDOR_SESSION_LIFETIME: "30"
  SESSION_ENCRYPT: "true"
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CORS_ALLOWED_ORIGINS: http://localhost:5173
  SANCTUM_STATEFUL_DOMAINS: localhost:5173,localhost:8000,127.0.0.1:5173,127.0.0.1:8000
  SEED_DEMO_DATA: "true"
  DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-ChangeMeNow1!}
  DEMO_VENDOR_PASSWORD: ${DEMO_VENDOR_PASSWORD:-ChangeMeNow1!}

x-api-service: &api-service
  build:
    context: ./apps/api
  environment: *api-environment
  volumes:
    - ./apps/api:/var/www/html
    - api_vendor:/var/www/html/vendor
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fuelflow}
      POSTGRES_USER: ${POSTGRES_USER:-fuelflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fuelflow-local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *api-service
    command: >
      sh -c "php artisan migrate --force &&
      php artisan db:seed --force &&
      php artisan serve --host=0.0.0.0 --port=8000 --no-reload"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:8000/api/v1/health > /dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  queue:
    <<: *api-service
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=120
    depends_on:
      api:
        condition: service_healthy

  scheduler:
    <<: *api-service
    command: php artisan schedule:work
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    environment:
      DOCKER_DEV: "true"
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api_vendor:
  postgres_data:
  redis_data:
  web_node_modules:
