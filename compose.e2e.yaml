services:
  postgres:
    ports: !override []

  redis:
    ports: !override []

  api:
    environment:
      APP_URL: http://127.0.0.1:18000
      FRONTEND_URL: http://127.0.0.1:15173
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:15173
      SANCTUM_STATEFUL_DOMAINS: 127.0.0.1:15173,127.0.0.1:18000
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
    ports: !override
      - "18000:8000"

  queue:
    environment:
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync

  scheduler:
    environment:
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync

  web:
    ports: !override
      - "15173:5173"
